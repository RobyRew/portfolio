# App-specific routing for the portfolio, layered on ghcr.io/robyrew/static-web.
#
# Every block that sets its own header must re-include the security headers:
# nginx add_header does not merge, so a block adding only Cache-Control would
# serve that response with no CSP at all.

# The tabbed profile replaced these pages. The default locale has no prefix now,
# so both the bare and the prefixed forms are handled. `en` is deliberately absent
# — those URLs are gone rather than redirected.
location ~ ^/(es|ca|ro)/about/?$      { return 301 "/$1/"; }
location ~ ^/(es|ca|ro)/contact/?$    { return 301 "/$1/"; }
location ~ ^/(es|ca|ro)/experience/?$ { return 301 "/$1/#resume"; }
location ~ ^/(es|ca|ro)/projects/?$   { return 301 "/$1/#projects"; }
location = /about      { return 301 /; }
location = /contact    { return 301 /; }
location = /experience { return 301 "/#resume"; }
location = /projects   { return 301 "/#projects"; }

location = /favicon.ico {
    include /etc/nginx/robyrew/security-headers.conf;
    return 302 /favicon.svg;
}

# A cached service worker outlives a deploy and keeps serving deleted assets.
location = /sw.js {
    include /etc/nginx/robyrew/security-headers.conf;
    expires -1;
    add_header Cache-Control "no-cache" always;
}

location = /manifest.webmanifest { expires 1d; }
location = /robots.txt   { expires 1d; access_log off; }
location = /sitemap.xml  { expires 1d; }
location = /sitemap-index.xml { expires 1d; }
